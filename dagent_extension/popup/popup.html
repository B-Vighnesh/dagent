<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Dagent - A Dark Pattern Detector</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

  <div class="header">
    <h1>DAGENT</h1>
  </div>
  <p class="status-text">A dark pattern detector</p>

  <div class="divider"></div>

  <div class="stats">
    <span class="stats-label">Total detections</span>
    <span class="stat-value" id="detectionCount">0</span>
    <p class="stat-breakdown" id="statBreakdown">
      <span class="confirmed" id="confirmedCount">0 confirmed</span>
      <span class="dot-sep">&middot;</span>
      <span class="unconfirmed" id="unconfirmedCount">0 unconfirmed</span>
    </p>
  </div>

  <div class="divider"></div>

  <button id="toggleDetectionsBtn" class="toggle-btn">Show recent detections</button>
  <ul class="detections" id="detectionsList" hidden>
    <!-- populated by popup.js -->
    <li class="detection-empty">No detections on this page yet.</li>
  </ul>

  <script src="popup.js"></script>
</body>
</html>
